name: Deploy UniEvent to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Test ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v --tb=short || echo "No tests yet"

  # ── Terraform Plan (PR only) ─────────────────────────────────────────────────
  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_ticketmaster_api_key: ${{ secrets.TICKETMASTER_API_KEY }}
        run: terraform -chdir=terraform plan -var="key_pair_name=unievent-key"

